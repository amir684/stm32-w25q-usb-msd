<svg width="740" height="400" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <rect width="740" height="400" fill="#1e1e2e" rx="14"/>

  <!-- Title -->
  <text x="370" y="34" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Hardware Wiring — Black Pill + W25Q64</text>

  <!-- ═══════════════ STM32 box ═══════════════ -->
  <rect x="20" y="55" width="195" height="305" fill="#181825" stroke="#89b4fa" stroke-width="2" rx="10"/>
  <text x="117" y="80"  text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="bold">STM32F401RC</text>
  <text x="117" y="97"  text-anchor="middle" fill="#89b4fa" font-size="11">WeAct Black Pill</text>

  <!-- STM32 pins — right edge connectors -->
  <!-- row y positions: 130,155,180,205,230,255,280,320,345 -->

  <!-- 3.3V -->
  <circle cx="215" cy="130" r="4" fill="#a6e3a1"/>
  <text x="205" y="134" text-anchor="end" fill="#a6e3a1" font-size="12">3.3V</text>

  <!-- GND -->
  <circle cx="215" cy="160" r="4" fill="#9399b2"/>
  <text x="205" y="164" text-anchor="end" fill="#9399b2" font-size="12">GND</text>

  <!-- PA4 -->
  <circle cx="215" cy="195" r="4" fill="#f38ba8"/>
  <text x="205" y="191" text-anchor="end" fill="#f38ba8" font-size="12">PA4</text>
  <text x="205" y="204" text-anchor="end" fill="#585b70" font-size="10">(CS)</text>

  <!-- PA5 -->
  <circle cx="215" cy="235" r="4" fill="#fab387"/>
  <text x="205" y="231" text-anchor="end" fill="#fab387" font-size="12">PA5</text>
  <text x="205" y="244" text-anchor="end" fill="#585b70" font-size="10">(SCK)</text>

  <!-- PA6 -->
  <circle cx="215" cy="275" r="4" fill="#89dceb"/>
  <text x="205" y="271" text-anchor="end" fill="#89dceb" font-size="12">PA6</text>
  <text x="205" y="284" text-anchor="end" fill="#585b70" font-size="10">(MISO)</text>

  <!-- PA7 -->
  <circle cx="215" cy="315" r="4" fill="#cba6f7"/>
  <text x="205" y="311" text-anchor="end" fill="#cba6f7" font-size="12">PA7</text>
  <text x="205" y="324" text-anchor="end" fill="#585b70" font-size="10">(MOSI)</text>

  <!-- PA11 / PA12 — left side -->
  <circle cx="20" cy="352" r="4" fill="#f9e2af"/>
  <text x="30" y="348" text-anchor="start" fill="#f9e2af" font-size="12">PA11 D−</text>
  <circle cx="20" cy="370" r="4" fill="#f9e2af"/>
  <text x="30" y="374" text-anchor="start" fill="#f9e2af" font-size="12">PA12 D+</text>

  <!-- USB symbol (left) -->
  <rect x="1" y="341" width="19" height="38" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1.5" rx="3"/>
  <text x="10" y="354" text-anchor="middle" fill="#f9e2af" font-size="8" font-weight="bold">USB</text>
  <text x="10" y="365" text-anchor="middle" fill="#f9e2af" font-size="7">Type</text>
  <text x="10" y="374" text-anchor="middle" fill="#f9e2af" font-size="7">-C</text>

  <!-- ═══════════════ W25Q64 box ═══════════════ -->
  <rect x="505" y="95" width="210" height="220" fill="#181825" stroke="#a6e3a1" stroke-width="2" rx="10"/>
  <text x="610" y="120" text-anchor="middle" fill="#a6e3a1" font-size="13" font-weight="bold">W25Q64</text>
  <text x="610" y="138" text-anchor="middle" fill="#a6e3a1" font-size="11">SPI NOR Flash  8 MB</text>

  <!-- W25Q left-side pins (1-4) -->
  <circle cx="505" cy="165" r="4" fill="#f38ba8"/>
  <text x="515" y="169" fill="#f38ba8" font-size="12">1  /CS</text>

  <circle cx="505" cy="195" r="4" fill="#89dceb"/>
  <text x="515" y="199" fill="#89dceb" font-size="12">2  DO (MISO)</text>

  <circle cx="505" cy="225" r="4" fill="#9399b2"/>
  <text x="515" y="229" fill="#9399b2" font-size="12">3  /WP → 3.3V</text>

  <circle cx="505" cy="255" r="4" fill="#9399b2"/>
  <text x="515" y="259" fill="#9399b2" font-size="12">4  GND</text>

  <!-- W25Q right-side pins (5-8) -->
  <circle cx="715" cy="165" r="4" fill="#cba6f7"/>
  <text x="705" y="169" text-anchor="end" fill="#cba6f7" font-size="12">DI (MOSI)  5</text>

  <circle cx="715" cy="195" r="4" fill="#fab387"/>
  <text x="705" y="199" text-anchor="end" fill="#fab387" font-size="12">CLK        6</text>

  <circle cx="715" cy="225" r="4" fill="#9399b2"/>
  <text x="705" y="229" text-anchor="end" fill="#9399b2" font-size="12">/HOLD→3.3V 7</text>

  <circle cx="715" cy="255" r="4" fill="#a6e3a1"/>
  <text x="705" y="259" text-anchor="end" fill="#a6e3a1" font-size="12">VCC        8</text>

  <!-- ═══════════════ Connection wires ═══════════════ -->

  <!-- 3.3V → VCC (pin 8) -->
  <polyline points="215,130 350,130 350,255 505,255" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="none"/>
  <!-- actually VCC is at y=255... wait, VCC is pin 8 at y=255 on right side. But those are right-side pins. Let me rethink the routing. -->
  <!-- VCC right side at x=715, y=255. Route: 215,130 → 730,130 → 730,255 → 715,255 -->
  <polyline points="215,130 735,130 735,255 715,255" fill="none" stroke="#a6e3a1" stroke-width="1.8"/>

  <!-- GND → GND (pin 4, left side at x=505, y=255) -->
  <polyline points="215,160 350,160 350,255 505,255" fill="none" stroke="#9399b2" stroke-width="1.8"/>

  <!-- PA4 → /CS (pin 1, left side at x=505, y=165) -->
  <polyline points="215,195 360,195 360,165 505,165" fill="none" stroke="#f38ba8" stroke-width="1.8"/>

  <!-- PA5 → CLK (pin 6, right side at x=715, y=195) -->
  <polyline points="215,235 726,235 726,195 715,195" fill="none" stroke="#fab387" stroke-width="1.8"/>

  <!-- PA6 → DO/MISO (pin 2, left side at x=505, y=195) -->
  <polyline points="215,275 370,275 370,195 505,195" fill="none" stroke="#89dceb" stroke-width="1.8"/>

  <!-- PA7 → DI/MOSI (pin 5, right side at x=715, y=165) -->
  <polyline points="215,315 720,315 720,165 715,165" fill="none" stroke="#cba6f7" stroke-width="1.8"/>

  <!-- /WP tie to 3.3V rail (small tee) -->
  <polyline points="505,225 480,225 480,130" fill="none" stroke="#9399b2" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- /HOLD tie to 3.3V rail -->
  <polyline points="715,225 736,225 736,130" fill="none" stroke="#9399b2" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ═══════════════ Legend ═══════════════ -->
  <rect x="245" y="340" width="250" height="48" fill="#181825" stroke="#45475a" stroke-width="1" rx="6"/>
  <text x="370" y="356" text-anchor="middle" fill="#585b70" font-size="10">SPI1 @ 21 MHz  (PCLK2 84 MHz ÷ 4)</text>
  <text x="370" y="372" text-anchor="middle" fill="#585b70" font-size="10">USB OTG FS @ 48 MHz exact</text>
  <text x="370" y="384" text-anchor="middle" fill="#585b70" font-size="10">All signals at 3.3 V logic</text>
</svg>
