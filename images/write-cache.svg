<svg width="720" height="430" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <rect width="720" height="430" fill="#1e1e2e" rx="14"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Write-Back Cache — Before vs After</text>

  <!-- ════════════════════════════════════════════
       LEFT SIDE: Without cache
  ════════════════════════════════════════════ -->
  <text x="180" y="60" text-anchor="middle" fill="#f38ba8" font-size="13" font-weight="bold">Without Cache</text>

  <!-- Sector label -->
  <rect x="20" y="72" width="320" height="22" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="180" y="88" text-anchor="middle" fill="#585b70" font-size="11">Sector 0  (4 KB = 8 × 512 B blocks)</text>

  <!-- 8 block rows, each showing: host sends block → full erase+write -->
  <!-- Block colours alternating for visibility -->
  <!-- Row template: label | [USB block] → [Read 4KB] [ERASE] [Write ×16] -->

  <!-- Helper: define a row at y offset -->
  <!-- Block 0 row at y=100 -->
  <text x="20" y="114" fill="#9399b2" font-size="10">blk 0</text>
  <rect x="55"  y="100" width="34" height="18" fill="#89b4fa" rx="2"/>
  <text x="72"  y="113" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">USB</text>
  <text x="95"  y="113" fill="#585b70" font-size="10">→</text>
  <rect x="105" y="100" width="44" height="18" fill="#313244" stroke="#89dceb" stroke-width="1" rx="2"/>
  <text x="127" y="113" text-anchor="middle" fill="#89dceb" font-size="9">Read</text>
  <rect x="153" y="100" width="54" height="18" fill="#f38ba8" rx="2"/>
  <text x="180" y="113" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">ERASE</text>
  <rect x="211" y="100" width="120" height="18" fill="#313244" stroke="#fab387" stroke-width="1" rx="2"/>
  <text x="271" y="113" text-anchor="middle" fill="#fab387" font-size="9">Write ×16 pages</text>
  <text x="336" y="113" fill="#f38ba8" font-size="9">93 ms</text>

  <!-- Block 1 -->
  <text x="20" y="132" fill="#9399b2" font-size="10">blk 1</text>
  <rect x="55"  y="118" width="34" height="18" fill="#89b4fa" rx="2"/>
  <text x="72"  y="131" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">USB</text>
  <text x="95"  y="131" fill="#585b70" font-size="10">→</text>
  <rect x="105" y="118" width="44" height="18" fill="#313244" stroke="#89dceb" stroke-width="1" rx="2"/>
  <text x="127" y="131" text-anchor="middle" fill="#89dceb" font-size="9">Read</text>
  <rect x="153" y="118" width="54" height="18" fill="#f38ba8" rx="2"/>
  <text x="180" y="131" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">ERASE</text>
  <rect x="211" y="118" width="120" height="18" fill="#313244" stroke="#fab387" stroke-width="1" rx="2"/>
  <text x="271" y="131" text-anchor="middle" fill="#fab387" font-size="9">Write ×16 pages</text>
  <text x="336" y="131" fill="#f38ba8" font-size="9">93 ms</text>

  <!-- Dots -->
  <text x="180" y="152" text-anchor="middle" fill="#585b70" font-size="16">⋮</text>

  <!-- Block 7 -->
  <text x="20" y="178" fill="#9399b2" font-size="10">blk 7</text>
  <rect x="55"  y="164" width="34" height="18" fill="#89b4fa" rx="2"/>
  <text x="72"  y="177" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">USB</text>
  <text x="95"  y="177" fill="#585b70" font-size="10">→</text>
  <rect x="105" y="164" width="44" height="18" fill="#313244" stroke="#89dceb" stroke-width="1" rx="2"/>
  <text x="127" y="177" text-anchor="middle" fill="#89dceb" font-size="9">Read</text>
  <rect x="153" y="164" width="54" height="18" fill="#f38ba8" rx="2"/>
  <text x="180" y="177" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">ERASE</text>
  <rect x="211" y="164" width="120" height="18" fill="#313244" stroke="#fab387" stroke-width="1" rx="2"/>
  <text x="271" y="177" text-anchor="middle" fill="#fab387" font-size="9">Write ×16 pages</text>
  <text x="336" y="177" fill="#f38ba8" font-size="9">93 ms</text>

  <!-- Total for 1 sector -->
  <rect x="20" y="192" width="350" height="24" fill="#45475a" rx="4"/>
  <text x="195" y="209" text-anchor="middle" fill="#f38ba8" font-size="12" font-weight="bold">1 sector = 8 × 93 ms = 744 ms</text>

  <!-- Scale bar: 3 MB stats -->
  <rect x="20" y="226" width="350" height="22" fill="#181825" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="195" y="242" text-anchor="middle" fill="#f38ba8" font-size="11">3 MB file ≈ 9.5 minutes</text>

  <!-- ════════════════════════════════════════════
       DIVIDER
  ════════════════════════════════════════════ -->
  <line x1="375" y1="55" x2="375" y2="390" stroke="#45475a" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ════════════════════════════════════════════
       RIGHT SIDE: With cache
  ════════════════════════════════════════════ -->
  <text x="548" y="60" text-anchor="middle" fill="#a6e3a1" font-size="13" font-weight="bold">With Cache  ✓</text>

  <!-- Sector label -->
  <rect x="390" y="72" width="320" height="22" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="550" y="88" text-anchor="middle" fill="#585b70" font-size="11">Sector 0  (4 KB = 8 × 512 B blocks)</text>

  <!-- Blocks 0-7: patch into RAM only -->
  <!-- Block 0 -->
  <text x="390" y="114" fill="#9399b2" font-size="10">blk 0</text>
  <rect x="425" y="100" width="34" height="18" fill="#89b4fa" rx="2"/>
  <text x="442" y="113" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">USB</text>
  <text x="465" y="113" fill="#585b70" font-size="10">→</text>
  <rect x="477" y="100" width="160" height="18" fill="#313244" stroke="#a6e3a1" stroke-width="1.5" rx="2"/>
  <text x="557" y="113" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">patch RAM buffer  &lt;1 µs</text>

  <!-- Block 1 -->
  <text x="390" y="132" fill="#9399b2" font-size="10">blk 1</text>
  <rect x="425" y="118" width="34" height="18" fill="#89b4fa" rx="2"/>
  <text x="442" y="131" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">USB</text>
  <text x="465" y="131" fill="#585b70" font-size="10">→</text>
  <rect x="477" y="118" width="160" height="18" fill="#313244" stroke="#a6e3a1" stroke-width="1.5" rx="2"/>
  <text x="557" y="131" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">patch RAM buffer  &lt;1 µs</text>

  <!-- Dots -->
  <text x="550" y="152" text-anchor="middle" fill="#585b70" font-size="16">⋮</text>

  <!-- Block 7 -->
  <text x="390" y="178" fill="#9399b2" font-size="10">blk 7</text>
  <rect x="425" y="164" width="34" height="18" fill="#89b4fa" rx="2"/>
  <text x="442" y="177" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="bold">USB</text>
  <text x="465" y="177" fill="#585b70" font-size="10">→</text>
  <rect x="477" y="164" width="160" height="18" fill="#313244" stroke="#a6e3a1" stroke-width="1.5" rx="2"/>
  <text x="557" y="177" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="bold">patch RAM buffer  &lt;1 µs</text>

  <!-- Flush arrow (when sector changes or read arrives) -->
  <text x="550" y="206" text-anchor="middle" fill="#585b70" font-size="10">sector change / read → flush</text>
  <line x1="550" y1="210" x2="550" y2="220" stroke="#fab387" stroke-width="1.5"/>
  <polygon points="550,224 545,215 555,215" fill="#fab387"/>

  <!-- Single erase+write -->
  <rect x="390" y="225" width="320" height="18" fill="#181825" stroke="#fab387" stroke-width="1.5" rx="4"/>
  <text x="550" y="238" text-anchor="middle" fill="#fab387" font-size="10">ERASE  +  Write ×16 pages  =  93 ms  (once)</text>

  <!-- Total for 1 sector -->
  <rect x="390" y="253" width="320" height="24" fill="#45475a" rx="4"/>
  <text x="550" y="270" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">1 sector = 93 ms  (was 744 ms)</text>

  <!-- Scale bar: 3 MB stats -->
  <rect x="390" y="287" width="320" height="22" fill="#181825" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="550" y="303" text-anchor="middle" fill="#a6e3a1" font-size="11">3 MB file ≈ 70 seconds</text>

  <!-- ════════════════════════════════════════════
       SPEEDUP BANNER
  ════════════════════════════════════════════ -->
  <rect x="20" y="330" width="680" height="50" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="8"/>
  <text x="360" y="352" text-anchor="middle" fill="#f9e2af" font-size="14" font-weight="bold">Sequential write speedup:  ~8×</text>
  <text x="360" y="372" text-anchor="middle" fill="#9399b2" font-size="11">Limit: W25Q sector erase ~45 ms (hardware) — unavoidable without a larger RAM buffer</text>

  <!-- ════════════════════════════════════════════
       CACHE FLUSH RULES (bottom note)
  ════════════════════════════════════════════ -->
  <text x="20" y="402" fill="#585b70" font-size="10">flush_cache() is triggered by:  (1) next write targets a different sector   (2) any read request   (3) USB reconnect / Init</text>
</svg>
